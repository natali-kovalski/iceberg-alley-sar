# Iceberg Alley SAR: pipeline configuration.
# Paths are relative to the repo root.

paths:
  aoi: aoi.geojson
  data_dir: data
  raw: data/raw            # HyP3 downloads
  interim: data/interim    # masked / calibrated rasters
  outputs: data/outputs    # detections, quicklooks, CZML
  land_mask: data/land/osm_land_aoi.gpkg  # OSM land polygons clipped to AOI (built by `land-mask`)
  ground_truth: data/ground_truth   # NAIS iceberg chart GIFs (downloaded)
  czml: viewer/public/data/iceberg_alley.czml   # written by `czml`, served by the Vue viewer (gitignored)
  kaggle: data/kaggle/train.json   # Statoil/C-CORE iceberg classifier challenge (Kaggle terms: don't redistribute)
  models: data/models              # trained weights (gitignored)

search:
  # Spring 2025: S1A + S1C give dense IW HH+HV coverage (HH/HV: co- and cross-pol, as used for CFAR and the sea-ice mask).
  start_date: "2026-06-01"
  end_date: "2026-09-29"
  platform: SENTINEL-1
  processing_levels: [GRD_HD, GRD_MD]   # IW comes as GRD_HD; EW comes as GRD_MD (medium res)
  beam_modes: [IW, EW]      # IW is usually VV/VH, EW is usually HH/HV. Check each scene.
  max_results: 20

run:
  # Scene selection for `run` (end to end over search.start_date .. end_date, or --start/--end).
  pol: HH+HV                # CFAR and the pack-ice mask are tuned on HV; null = any
  min_aoi_overlap: 0.05     # skip scenes that barely touch the AOI
  max_scenes: 3             # best-covering scenes per run; caps HyP3 credits (60/scene at 10 m). null = all

hyp3:
  job_type: RTC_GAMMA
  resolution: 10            # metres. 10 resolves small bergs (60 credits/scene, ~4x disk); 20 is cheaper (15).
  scale: power              # linear power; convert to dB where needed
  radiometry: gamma0
  dem_matching: false
  include_inc_map: true     # incidence angle per detection (backscatter depends on it)
  include_scattering_area: false

preprocess:
  # OSM land polygons (ODbL). ~900 MB one-time download; only the AOI clip is kept in use.
  land_polygons_url: https://osmdata.openstreetmap.de/download/land-polygons-split-4326.zip
  land_polygons_member: land-polygons-split-4326/land_polygons.shp
  land_buffer_m: 500        # removes coastal clutter from shoreline and small islands
  # Rocks/reefs/islets mapped only as OSM nodes are not in the land polygons; add them as discs
  # (then buffered by land_buffer_m like any coast). Fetched once into data/land/.
  land_point_tags:
    natural: [rock, bare_rock, islet, reef, shoal, stone]
    place: [islet, island]
    man_made: [lighthouse, offshore_platform]
  land_point_radius_m: 20
  overpass_urls:
    - https://overpass-api.de/api/interpreter
    - https://overpass.private.coffee/api/interpreter
    - https://overpass.kumi.systems/api/interpreter
  mask_outside_aoi: true    # only keep ocean pixels inside aoi.geojson
  metric_crs: EPSG:32621    # UTM 21N for metric processing if the scene is not already projected
  quicklook_db_range: null  # [min, max] dB, or null to use 2nd-99.9th percentile of sea pixels
  quicklook_max_px: 4096    # longest side of the PNG
  quicklook_pool: max       # max keeps 1-3 px icebergs visible when downsampling; "mean" looks smoother

seaice:
  # Pack-ice mask from cross-pol backscatter, computed on coarse cells.
  # Tuned on S1A 2025-05-08: water ~ -31 dB / CV ~1.1, pack ice ~ -20 dB / CV ~0.5.
  enabled: true
  band: HV                  # falls back to VH for VV/VH scenes
  cell_m: 200               # coarse cells; big enough for stable stats, small vs. ice floes
  min_excess_db: 6          # brighter than the open-water reference (25th pct of cells) by this much
  min_db: -30               # and at least this bright. Calm days put the reference near -40 dB (HyP3
                            # removes the HV noise floor) and coastal water passed +6 dB alone.
                            # Real ice cells: p1 -27.6 dB (sigma0); false coastal "ice" -30 to -31 dB.
  max_cv: 0.8               # pack ice is uniform at 200 m; iceberg cells are spiky (CV > 1)
  min_area_km2: 2           # smallest pack-ice core kept
  strip_min_km2: 0.5        # connected bright cells this large count as ice strips; icebergs light 1-4 cells
  buffer_m: 1000            # catches loose floes at the ice edge

cfar:
  variant: CA               # cell-averaging. Simple, fast, standard baseline.
  # Window sizes are in metres and converted per scene (5 / 20 px at 20 m, 10 / 40 px at 10 m).
  guard_m: 100              # guard half-width, keeps a target's own energy out of the background estimate
  background_m: 400         # background half-width
  pfa: 1.0e-6               # false-alarm probability, sets the threshold factor
  band: HV                  # cross-pol usually gives better target/sea contrast; fallback VH
  enl: auto                 # speckle looks for the threshold; "auto" = 1/median(CV)^2 over water
  enl_cell_m: 500           # cell size for the ENL estimate
  min_background_fraction: 0.5  # skip pixels whose ring is mostly masked (coast, ice edge)

detections:
  min_area_px: 2            # in pixels; at 10 m (oversampled GRD) speckle passes this, the co-pol check removes it
  max_area_m2: 800000       # 0.8 km²
  edge_buffer_m: 200        # drop targets this close to land/ice/nodata masks
  max_extent_m: 1280        # anything taller is not a berg or ship
  grow_db: 4                # region-grow level (dB over background, 3x3 smoothed) around each target
  max_structure_m: 300      # longer grown structures are sea-ice strips (tuned on 2025-05-08 at 20 m)
  copol_min_contrast_db: 6  # HH peak over HH background; drops HV-only speckle (10 m HV noise ~0 dB, bergs 3-20 dB). null = off
  merge_by_structure: true  # CFAR cores in one grown blob = one target (ships split into 2 cores ~50 m apart)
  block_rows: 1024          # rows per processing block (memory vs. overhead)

ground_truth:
  # NAIS (IIP + Canadian Ice Service) daily Iceberg Analysis: icebergs per 1-degree square.
  nais_url: https://www.navcen.uscg.gov/sites/default/files/images/iip/data/{year}/{ymd}_NAIS65.gif
  min_valid_fraction: 0.2   # compare only squares the scene covers at least this much

validation:
  # Point-level validation against IIP sightings (NSIDC G00807, seasons up to 2021) and
  # Sentinel-2 optical targets. See `validate-points`.
  iip_dir: data/ground_truth/iip_sightings
  s2_dir: data/ground_truth/s2
  max_dist_m: 500           # match tolerance after drift correction (IIP positions are ~100 m)
  offset_search_m: 15000    # drift search half-width (0.5 m/s for 8 h = 14 km)
  offset_step_m: 250
  aircraft_window_h: 8      # aircraft / ship sightings up to this long after the SAR pass
  satellite_window_min: 30  # Sentinel-1 sightings within this of the SAR pass (same pass)
  s2_max_cloud: 90          # skip Sentinel-2 tiles cloudier than this

static_targets:
  # Fixed targets missing from OSM (unmapped rocks/islets): same spot on several dates.
  # Bergs drift 100s of m between passes; rocks repeat within the ~10-30 m geolocation error.
  radius_m: 50              # same-target distance between dates
  min_dates: 3              # distinct acquisition days (2 also drops bergs grounded for one revisit)
  min_span_days: 0          # raise (e.g. 30) to keep bergs grounded for a few passes
  # Written to data/outputs/static_targets_<band>.geojson; removed from the CZML only.

viewer:
  # CZML styling. Nothing is dropped: near-ice candidates are greyed out and can be hidden.
  near_ice_km: 5            # closer than this to pack ice = likely floe (88% of 2025-05-02 detections)
  last_interval_days: 7     # max days a scene stays on the timeline before the next pass (6 d revisit + slack)
  contrast_db_range: [10, 20]   # colour ramp for contrast over background (~p10-p90 at sea)
  colormap: plasma
  point_px_range: [6, 16]   # point size from structure_m (0 .. structure_m_max)
  structure_m_max: 300
  simplify_m: 100           # footprint / pack-ice outline simplification

chips:
  # Chips around detections for the iceberg/ship CNN, matched to the Kaggle chips.
  # Kaggle pixels are ~10 m like our 10 m RTC (measured: same speckle correlation and ENL), so no resampling.
  size_px: 75
  to_sigma0: true           # Kaggle is sigma0; HyP3 RTC is gamma0 (sigma0 = gamma0 * cos(incidence))
  hv_noise_floor: true      # HyP3 removes HV thermal noise (~-44 dB at sea); Kaggle keeps it (~-24..-29 dB)
  noise_looks: 4.5          # ENL of the added noise, as measured on the Kaggle HV background

classifier:
  # Experimental. Each variant is trained with stratified k-fold CV; the folds form the ensemble.
  # The first variant fills `iceberg_prob`; the others are cross-checks.
  variants:
    hhhv: [HH, HV]          # both bands, HV with the added noise floor
    hh: [HH]                # control: no HV, so no noise-floor assumption
  use_incidence_angle: true # Kaggle's missing angles are all ships; they are imputed to hide that leak
  folds: 5
  epochs: 40
  batch_size: 64
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  width: 16                 # channels in the first conv block (16-32-64-128)
  dropout: 0.3
  seed: 42

thor:
  # Milestone 5: THOR foundation model (FM4CS, Apache 2.0) as a frozen encoder + trained head.
  model: thor_v1_tiny       # paper: Tiny ~ Base for icebergs, at a fraction of the compute
  bands: [HH, HV]           # THOR has its own HH/HV patch embeddings, no VV/VH slot swap needed
  patch_px: 8               # 512 px crop -> 64x64 tokens; 4 is ~4x the cost (try only if small bergs are missed)
  crop_px: 512
  layer: 5                  # encoder block (0-11) for the smoke test; mid blocks separate bergs best (5a sweep)
  to_sigma0: true           # THOR was pretrained on sigma0; HyP3 RTC is gamma0 (sigma0 = gamma0 * cos(inc))
  db_clip: [-40, 10]        # HyP3 removes the HV noise floor; values below -40 dB are noise residue
  norm:                     # dB mean / std of THOR's 10 m IW pretraining data (thor_vit.py, S1:IW-HH/HV)
    HH: [-13.9485, 6.8015]
    HV: [-22.4575, 6.9106]
  smoke:
    scene: S1A_IW_20250508T094925_DHP_RTC10_G_gpuned_02C1
    ice_fraction_range: [0.05, 0.5]   # auto crop: most CFAR detections with some pack ice in view
  training:
    # 5b: frames with same-pass IIP Sentinel-1 analyst labels (point labels, no drift).
    dir: data/thor          # scenes list, chips, features (gitignored)
    seasons: [2019, 2020, 2021]
    holdout:                # never trained on: the 2019-04-15 / 04-29 test scenes and their bergs
      - ["2019-03-25", "2019-05-06"]   # April + 1 week each side (bergs drift only 10-20 km/day)
    pol: HH+HV
    pass_gap_min: 30        # sightings closer in time than this are one pass
    match_min: 5            # ASF frame time window around the sightings
    min_sightings: 10       # AOI sightings needed before a pass is searched
    max_scenes: 20          # disk (~6 GB/scene raw at 10 m) is the limit, not credits
    credits_per_scene: 60   # HyP3 RTC at 10 m
    max_credits: 1500
    radiometry: sigma0      # THOR was pretrained on sigma0
  targets:
    # IIP positions are truncated to 0.1 arc-minutes (~185 m N-S, ~120 m E-W here). Labels are
    # first moved to their cell centre (iip.cell_centres): median error 135 m -> 67 m, p90 118 m.
    snap_m: 200             # then to the brightest HH peak within this distance...
    snap_background_m: 600  # ...measured against the median of the ring out to here...
    snap_min_db: 6          # ...if it is at least this much brighter (as copol_min_contrast_db)
    sigma_m: 60             # Gaussian target width; rendered on the token grid at training time
  chips:
    # 5b: 512 px crops; scenes must be preprocessed (land + pack-ice masks) first.
    margin_px: 48           # labels sit at least this far inside a positive crop (random jitter)
    min_sea_fraction: 0.5   # skip crops that are mostly land / outside AOI / nodata
    negatives_per_positive: 1.0
    negative_mix: {water: 0.5, ice_edge: 0.25, edge: 0.25}   # edge = coast, AOI or swath border
    ice_edge_range: [0.05, 0.6]     # pack-ice fraction of an ice-edge crop
    edge_range: [0.05, 0.5]         # land/nodata fraction of an edge crop
    labelled_area_buffer_m: 10000   # negatives only near where the analysts labelled
    unlabelled_radius_m: 300        # CFAR detections farther than this from a label -> ignore in loss
    coarse_factor: 16               # crop planning on a 160 m grid
    seed: 42
    val:                            # 8 weeks from any training frame, so no shared bergs
      - ["2019-02-01", "2019-03-24"]

output:
  crs: EPSG:4326

figures:
  # `figures` regenerates these in docs/img from current outputs. viewer.png is a manual screenshot.
  out_dir: docs/img
  validation:
    scene: S1A_IW_20190429T094108_DHP_RTC10_G_gpuned_671B
    truth: iip-satellite
    band: HV
    file: validation_20190429.png
  detections:
    scene: S1A_IW_20250508T094925_DHP_RTC10_G_gpuned_02C1
    band: HV
    file: detections_20250508.png
