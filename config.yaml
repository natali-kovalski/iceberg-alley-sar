# Iceberg Alley SAR: pipeline configuration.
# Paths are relative to the repo root.

paths:
  aoi: aoi.geojson
  data_dir: data
  raw: data/raw            # HyP3 downloads
  interim: data/interim    # masked / calibrated rasters
  outputs: data/outputs    # detections, quicklooks, CZML
  land_mask: data/land/osm_land_aoi.gpkg  # OSM land polygons clipped to AOI (built by `land-mask`)
  ground_truth: data/ground_truth   # NAIS iceberg chart GIFs (downloaded)
  czml: data/outputs/iceberg_alley.czml   # written by `czml`; `publish` splits it into publish.out_dir
  compare_figures: data/outputs/compare   # per-scene THOR vs CFAR recall figures (`thor-compare`, `czml`); copied by `publish`
  kaggle: data/kaggle/train.json   # Statoil/C-CORE iceberg classifier challenge (Kaggle terms: don't redistribute)
  models: data/models              # trained weights (gitignored)

search:
  # Spring 2025: S1A + S1C give dense IW HH+HV coverage (HH/HV: co- and cross-pol, as used for CFAR and the sea-ice mask).
  start_date: "2026-06-01"
  end_date: "2026-09-29"
  platform: SENTINEL-1
  processing_levels: [GRD_HD, GRD_MD]   # IW comes as GRD_HD; EW comes as GRD_MD (medium res)
  beam_modes: [IW, EW]      # IW is usually VV/VH, EW is usually HH/HV. Check each scene.
  max_results: 20

run:
  # Scene selection for `run` (end to end over search.start_date .. end_date, or --start/--end).
  pol: HH+HV                # CFAR and the pack-ice mask are tuned on HV; null = any
  min_aoi_overlap: 0.05     # skip scenes that barely touch the AOI
  max_scenes: 3             # best-covering scenes per run; caps HyP3 credits (60/scene at 10 m). null = all
  detectors: [thor, cfar]   # THOR is the detector, the CFAR the baseline; `run --detectors` overrides
                            # THOR is skipped (one notice) without a CUDA GPU or the trained head
                            # (head = viewer.thor_model, under paths.models; `thor-fetch-head`)
  thor_device: cuda

hyp3:
  job_type: RTC_GAMMA
  resolution: 10            # metres. 10 resolves small bergs (60 credits/scene, ~4x disk); 20 is cheaper (15).
  scale: power              # linear power; convert to dB where needed
  radiometry: gamma0
  dem_matching: false
  include_inc_map: true     # incidence angle per detection (backscatter depends on it)
  include_scattering_area: false

preprocess:
  # OSM land polygons (ODbL). ~900 MB one-time download; only the AOI clip is kept in use.
  land_polygons_url: https://osmdata.openstreetmap.de/download/land-polygons-split-4326.zip
  land_polygons_member: land-polygons-split-4326/land_polygons.shp
  land_buffer_m: 500        # removes coastal clutter from shoreline and small islands
  # Rocks/reefs/islets mapped only as OSM nodes are not in the land polygons; add them as discs
  # (then buffered by land_buffer_m like any coast). Fetched once into data/land/.
  land_point_tags:
    natural: [rock, bare_rock, islet, reef, shoal, stone]
    place: [islet, island]
    man_made: [lighthouse, offshore_platform]
  land_point_radius_m: 20
  overpass_urls:
    - https://overpass-api.de/api/interpreter
    - https://overpass.private.coffee/api/interpreter
    - https://overpass.kumi.systems/api/interpreter
  mask_outside_aoi: true    # only keep ocean pixels inside aoi.geojson
  metric_crs: EPSG:32621    # UTM 21N for metric processing if the scene is not already projected
  quicklook_db_range: null  # [min, max] dB, or null to use 2nd-99.9th percentile of sea pixels
  quicklook_max_px: 4096    # longest side of the PNG
  quicklook_pool: max       # max keeps 1-3 px icebergs visible when downsampling; "mean" looks smoother

seaice:
  # Pack-ice mask from cross-pol backscatter, computed on coarse cells.
  # Tuned on S1A 2025-05-08: water ~ -31 dB / CV ~1.1, pack ice ~ -20 dB / CV ~0.5.
  enabled: true
  band: HV                  # falls back to VH for VV/VH scenes
  cell_m: 200               # coarse cells; big enough for stable stats, small vs. ice floes
  min_excess_db: 6          # brighter than the open-water reference (25th pct of cells) by this much
  min_db: -30               # and at least this bright. Calm days put the reference near -40 dB (HyP3
                            # removes the HV noise floor) and coastal water passed +6 dB alone.
                            # Real ice cells: p1 -27.6 dB (sigma0); false coastal "ice" -30 to -31 dB.
  max_cv: 0.8               # pack ice is uniform at 200 m; iceberg cells are spiky (CV > 1)
  min_area_km2: 2           # smallest pack-ice core kept
  strip_min_km2: 0.5        # connected bright cells this large count as ice strips; icebergs light 1-4 cells
  buffer_m: 1000            # catches loose floes at the ice edge

cfar:
  variant: CA               # cell-averaging. Simple, fast, standard baseline.
  # Window sizes are in metres and converted per scene (5 / 20 px at 20 m, 10 / 40 px at 10 m).
  guard_m: 100              # guard half-width, keeps a target's own energy out of the background estimate
  background_m: 400         # background half-width
  pfa: 1.0e-6               # false-alarm probability, sets the threshold factor
  band: HV                  # cross-pol usually gives better target/sea contrast; fallback VH
  enl: auto                 # speckle looks for the threshold; "auto" = 1/median(CV)^2 over water
  enl_cell_m: 500           # cell size for the ENL estimate
  min_background_fraction: 0.5  # skip pixels whose ring is mostly masked (coast, ice edge)

detections:
  min_area_px: 2            # in pixels; at 10 m (oversampled GRD) speckle passes this, the co-pol check removes it
  max_area_m2: 800000       # 0.8 km²
  edge_buffer_m: 200        # drop targets this close to land/ice/nodata masks
  max_extent_m: 1280        # anything taller is not a berg or ship
  grow_db: 4                # region-grow level (dB over background, 3x3 smoothed) around each target
  max_structure_m: 300      # longer grown structures are sea-ice strips (tuned on 2025-05-08 at 20 m)
  # The length rule above, only in scenes with pack ice (2026-10-26): auto = on when the scene's
  # HV pack-ice mask covers >= length_rule_min_ice_km2. In open water it only drops large bergs
  # (04-29 at 10 m: recall at 500 detections 0.75 with it, 0.83 without). on / off force it.
  # Our scenes: <= 300 km² (open water) or >= 1200 km² (2025-05-08, where it was tuned: 2100).
  length_rule: auto
  length_rule_min_ice_km2: 500
  copol_min_contrast_db: 6  # HH peak over HH background; drops HV-only speckle (10 m HV noise ~0 dB, bergs 3-20 dB). null = off
  merge_by_structure: true  # CFAR cores in one grown blob = one target (ships split into 2 cores ~50 m apart)
  block_rows: 512           # rows per processing block (memory vs. overhead; same detections at any size)

ground_truth:
  # NAIS (IIP + Canadian Ice Service) daily Iceberg Analysis: icebergs per 1-degree square.
  nais_url: https://www.navcen.uscg.gov/sites/default/files/images/iip/data/{year}/{ymd}_NAIS65.gif
  min_valid_fraction: 0.2   # compare only squares the scene covers at least this much

validation:
  # Point-level validation against IIP sightings (NSIDC G00807, seasons up to 2021) and
  # Sentinel-2 optical targets. See `validate-points`.
  iip_dir: data/ground_truth/iip_sightings
  s2_dir: data/ground_truth/s2
  max_dist_m: 500           # match tolerance after drift correction (IIP positions are ~100 m)
  offset_search_m: 15000    # drift search half-width (0.5 m/s for 8 h = 14 km)
  offset_step_m: 250
  aircraft_window_h: 8      # aircraft / ship sightings up to this long after the SAR pass
  satellite_window_min: 30  # Sentinel-1 sightings within this of the SAR pass (same pass)
  s2_max_cloud: 90          # skip Sentinel-2 tiles cloudier than this

static_targets:
  # Fixed targets missing from OSM (unmapped rocks/islets): same spot on several dates.
  # Bergs drift 100s of m between passes; rocks repeat within the ~10-30 m geolocation error.
  radius_m: 50              # same-target distance between dates
  min_dates: 3              # distinct acquisition days (2 also drops bergs grounded for one revisit)
  min_span_days: 0          # raise (e.g. 30) to keep bergs grounded for a few passes
  # Written to data/outputs/static_targets_<band>.geojson; removed from the CZML only.

viewer:
  # CZML styling. Nothing is dropped: near-ice candidates are greyed out and can be hidden.
  near_ice_km: 5            # closer than this to pack ice = likely floe (88% of 2025-05-02 detections)
  last_interval_days: 7     # max days a scene stays on the timeline before the next pass (6 d revisit + slack)
  # CFAR (orange dot) and THOR (cyan ring) share one size scale; colour only tells the detectors apart.
  size_breaks_m: [180, 270] # structure_m class breaks: small < 180 <= medium < 270 <= large (pooled terciles)
  size_px: [6, 13, 22]      # point diameter per class
  simplify_m: 100           # footprint / pack-ice outline simplification
  thor_model: thor-linear   # THOR layer (Milestone 5): `thor-detect` tag; shown at thor.compare.view_score
  exclude:                  # left out of the viewer: the ice mask misses the pack (the open-water
                            # reference is itself ice), so detections in ice show as open water
    - S1A_IW_20190228T094106_DHP_RTC10_G_spuned_6EBF
    - S1B_IW_20190306T094024_DHP_RTC10_G_spuned_3600
    - S1A_IW_20190317T094903_DHP_RTC10_G_spuned_3AF7

publish:
  # `publish` rebuilds out_dir (committed, served by GitHub Pages) from data/outputs/ only.
  out_dir: viewer/public/data
  scenes: all            # or a list of scene_ids
  detectors: [cfar, thor]
  max_file_mb: 25        # GitHub warns at 50 MB per file
  max_total_mb: 300

chips:
  # Chips around detections for the iceberg/ship CNN, matched to the Kaggle chips.
  # Kaggle pixels are ~10 m like our 10 m RTC (measured: same speckle correlation and ENL), so no resampling.
  size_px: 75
  to_sigma0: true           # Kaggle is sigma0; HyP3 RTC is gamma0 (sigma0 = gamma0 * cos(incidence))
  hv_noise_floor: true      # HyP3 removes HV thermal noise (~-44 dB at sea); Kaggle keeps it (~-24..-29 dB)
  noise_looks: 4.5          # ENL of the added noise, as measured on the Kaggle HV background

classifier:
  # Experimental. Each variant is trained with stratified k-fold CV; the folds form the ensemble.
  # The first variant fills `iceberg_prob`; the others are cross-checks.
  variants:
    hhhv: [HH, HV]          # both bands, HV with the added noise floor
    hh: [HH]                # control: no HV, so no noise-floor assumption
  use_incidence_angle: true # Kaggle's missing angles are all ships; they are imputed to hide that leak
  folds: 5
  epochs: 40
  batch_size: 64
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  width: 16                 # channels in the first conv block (16-32-64-128)
  dropout: 0.3
  seed: 42

thor:
  # Milestone 5: THOR foundation model (FM4CS, Apache 2.0) as a frozen encoder + trained head.
  model: thor_v1_tiny       # paper: Tiny ~ Base for icebergs, at a fraction of the compute
  bands: [HH, HV]           # THOR has its own HH/HV patch embeddings, no VV/VH slot swap needed
  patch_px: 8               # 512 px crop -> 64x64 tokens; 4 is ~4x the cost (try only if small bergs are missed)
  crop_px: 512
  layer: 5                  # encoder block (0-11) for the smoke test; mid blocks separate bergs best (5a sweep)
  to_sigma0: true           # THOR was pretrained on sigma0; HyP3 RTC is gamma0 (sigma0 = gamma0 * cos(inc))
  db_clip: [-40, 10]        # HyP3 removes the HV noise floor; values below -40 dB are noise residue
  norm:                     # dB mean / std of THOR's 10 m IW pretraining data (thor_vit.py, S1:IW-HH/HV)
    HH: [-13.9485, 6.8015]
    HV: [-22.4575, 6.9106]
  smoke:
    scene: S1A_IW_20250508T094925_DHP_RTC10_G_gpuned_02C1
    ice_fraction_range: [0.05, 0.5]   # auto crop: most CFAR detections with some pack ice in view
  training:
    # 5b: frames with same-pass IIP Sentinel-1 analyst labels (point labels, no drift).
    dir: data/thor          # scenes list, chips, features (gitignored)
    seasons: [2019, 2020, 2021]
    holdout:                # never trained on: the 2019-04-15 / 04-29 test scenes and their bergs
      - ["2019-03-25", "2019-05-06"]   # April + 1 week each side (bergs drift only 10-20 km/day)
    pol: HH+HV
    pass_gap_min: 30        # sightings closer in time than this are one pass
    match_min: 5            # ASF frame time window around the sightings
    min_sightings: 10       # AOI sightings needed before a pass is searched
    max_scenes: 20          # disk (~6 GB/scene raw at 10 m) is the limit, not credits
    credits_per_scene: 60   # HyP3 RTC at 10 m
    max_credits: 1500
    radiometry: sigma0      # THOR was pretrained on sigma0
  targets:
    # IIP positions are truncated to 0.1 arc-minutes (~185 m N-S, ~120 m E-W here). Labels are
    # first moved to their cell centre (iip.cell_centres): median error 135 m -> 67 m, p90 118 m.
    snap_m: 200             # then to the brightest HH peak within this distance...
    snap_background_m: 600  # ...measured against the median of the ring out to here...
    snap_min_db: 6          # ...if it is at least this much brighter (as copol_min_contrast_db)
    sigma_m: 60             # Gaussian target width; rendered on the token grid at training time
  chips:
    # 5b: 512 px crops; scenes must be preprocessed (land + pack-ice masks) first.
    margin_px: 48           # labels sit at least this far inside a positive crop (random jitter)
    min_sea_fraction: 0.5   # skip crops that are mostly land / outside AOI / nodata
    negatives_per_positive: 1.0
    negative_mix: {water: 0.5, ice_edge: 0.25, edge: 0.25}   # edge = coast, AOI or swath border
    ice_edge_range: [0.05, 0.6]     # pack-ice fraction of an ice-edge crop
    edge_range: [0.05, 0.5]         # land/nodata fraction of an edge crop
    labelled_area_buffer_m: 10000   # negatives only near where the analysts labelled
    unlabelled_radius_m: 300        # CFAR detections farther than this from a label -> ignore in loss
    coarse_factor: 16               # crop planning on a 160 m grid
    seed: 42
    val:                            # 8 weeks from any training frame, so no shared bergs
      - ["2019-02-01", "2019-03-24"]
  features:
    # 5c: frozen-encoder features cached per chip (float16, blocks concatenated).
    blocks: [2, 5, 8, 11]   # the paper's detector taps; 4 x 192 = 768 channels, ~6 MB per chip
    batch: 8
  head:
    hidden: 32              # CenterNet head width (1x1 -> 3x3 -> 1x1); 64-256 overfit (5c sweep)
    dropout: 0.5
    prior: 0.01             # initial berg probability per token (output bias)
  train:
    # Penalty-reduced focal loss (CenterNet): alpha on the prediction, beta on the Gaussian.
    focal_alpha: 2
    focal_beta: 4
    ignore_tokens: 1        # tokens within this of an unlabelled CFAR detection / masked label
    min_valid: 0.5          # tokens with less sea than this are ignored
    epochs: 200
    patience: 25            # early stopping on val loss
    batch: 32
    lr: 0.001
    weight_decay: 0.05
    match_m: 200            # val peak <-> label matching radius (labels are snapped, ~10 m)
    seed: 0
    # Year folds: val = training-split chips in these dates, a year from the train frames, so no
    # shared bergs. The chips' own val split (Feb-Mar 2019, bergs inside pack ice) is never
    # trained on and is scored as a separate pack-ice set. April 2019 (test) is never touched.
    folds:
      a: [["2020-01-01", "2020-12-31"]]   # train 2019 (May-Jun), val 2020 (Apr-May)
      b: [["2019-01-01", "2019-12-31"]]   # train 2020, val 2019 (May-Jun)
    final:
      # 5d models from both years (702 chips), no val set left. The folds fixed the recipe.
      linear:
        epochs: 150         # refit on all; fold best epochs 159 / 151, val loss flat from ~100
      centernet:
        ensemble: [a, b]    # mean probability of the early-stopped fold models (peaks ~epoch 12)
  infer:
    overlap_px: 128         # sliding windows overlap; each keeps its central tokens only
    score_min: 0.1          # peaks written to GeoJSON (5d sweeps the threshold above this)
    min_valid: 0.02         # skip windows with less sea than this
    batch: 8
    blob_window_m: 320      # attributes: berg blob grown around the peak within this window
    grow_db: 4              # blob = pixels this far above the ring background (as detections.grow_db)
  release:
    # 7c: the final linear head (769 parameters) as a GitHub release asset, so `run` needs no
    # retraining. `thor-fetch-head` saves it as <paths.models>/thor/<head>/final/head.pt.
    url: https://github.com/natali-kovalski/iceberg-alley-sar/releases/download/thor-head-v1/head.pt
    sha256: 659cb0f47016eb17c2012c6b255c94c998e7f310c51e08f42ce262f5e75b580f
    head: linear
  compare:
    # 5d: THOR vs CFAR on the held-out April 2019 scenes. Nothing in here is tuned on them.
    out_dir: data/outputs/thor/5d
    scenes:                 # product -> IIP truth (pointval.load_truth)
      S1A_IW_20190429T094108_DHP_RTC10_G_gpuned_671B: iip-satellite   # primary: same-pass analyst labels
      S1A_IW_20190415T095705_DHP_RTC10_G_gpuned_59A9: iip-aircraft    # secondary: ship/air 5.6 h later
      # Added after the first 5d run: more held-out frames with same-pass labels. HyP3 rejected the
      # richer open-ocean frames (no DEM coverage); these are the next ones it accepted.
      S1B_IW_20190423T094026_DHP_RTC10_G_gpuned_A784: iip-satellite
      S1A_IW_20190424T093305_DHP_RTC10_G_gpuned_132E: iip-satellite
      S1A_IW_20190417T094107_DHP_RTC10_G_gpuned_EDB4: iip-satellite
    cfar_pfas: [1.0e-3, 1.0e-4, 1.0e-5, 1.0e-6, 1.0e-7, 1.0e-8, 1.0e-10, 1.0e-12]
    thor_models: [thor-linear, thor-centernet]   # detection tags from `thor-detect` (final models)
    view_score: 0.35        # folds' best-F1 threshold: THOR operating point for the viewer
    # Aircraft truth drifts: one offset per scene from the pooled detections of both detectors
    # (CFAR at cfar.pfa, THOR at view_score), applied to both. Same reliability rule as pointval.
    radii_m: [100, 200, 300, 500]     # recall-vs-radius check; headline is validation.max_dist_m
    ice_bins_km: [0, 5, 20, 1000]     # truth distance to (buffered) pack ice
    incidence_bins_deg: [29, 35, 40, 47]

benchmark:
  # Stage 2: published CFAR detectors (Færch et al. 2023, The Cryosphere 17, 5335). The GPL-3.0
  # library runs in its own env through external/cfar_runner/run_cfar.py, files in and out.
  # Library behaviour behind these settings: benchmarks/cfar_api_notes.md.
  cfar_env_python: external/cfar-bench/Scripts/python.exe
  cfar_runner: external/cfar_runner/run_cfar.py
  out_dir: data/benchmark
  window_limit_px: 41       # library stencil is +-20 px; wider windows are silently cropped
  merge: AND                # HH/HV merge for gamma, lognorm, k (paper sec. 3.3)
  minsize_px: 2             # library drops objects smaller than this (paper: no 1-px objects)
  max_object_px: 500        # paper sec. 3.3: larger objects dropped as processing errors
  object_connectivity: 4    # same as the library's small-object filter
  masked_as_nan: true       # keep masked pixels out of the clutter ring (library checks the centre only)
  min_ring_fraction: 0.5    # skip pixels whose ring is mostly masked, as cfar.min_background_fraction; 0 = as-is
  # per_band: gamma / K use each band's own ENL (HyP3 HV water ENL << HH). single: the
  # library's one ENL for both (smoke.enl_combine). Wishart always takes the single value.
  enl_mode: per_band
  repro_tolerance_f1: 0.05  # Milestone 1f: |my F - paper F| at each detector's optimum PFA
  # Window diameters in metres -> nearest odd pixel count per raster (360 / 520 m = 9 / 13 px at 40 m)
  detectors:
    gamma:    {inner_m: 360, outer_m: 520}
    lognorm:  {inner_m: 360, outer_m: 520}
    k:        {inner_m: 360, outer_m: 520}
    nis:      {inner_m: 360, outer_m: 520}
    wishart:  {inner_m: 360, outer_m: 520}
    # iDPolRAD: test / training window, 3x3 / 57x57 px at 40 m in the paper. 57 px exceeds the
    # 41 px stencil, so the library crops it to 41x41 (as it must have for the paper).
    idpolrad: {inner_m: 120, outer_m: 2280, allow_window_crop: true}
  smoke:                    # Milestone 0c: all detectors on one IW frame
    scene: S1A_IW_20190429T094108_DHP_RTC10_G_gpuned_671B
    multilook: 4            # 10 m -> 40 m, mean of linear intensity
    multilook_min_valid: 1.0  # share of the 4x4 block that must be valid
    pfa: 1.0e-9             # total PFA (per channel 3.16e-5 for AND)
    enl_box_m: 2000         # side of the open-water boxes the ENL is estimated in
    enl_box: auto           # auto = the median-ENL box among fully valid boxes; or [W, S, E, N] in EPSG:4326
    enl_combine: min        # the single ENL (Wishart, or all in enl_mode single): min, mean, HH or HV
    quicklook_max_px: 2400
  iw_sweep:                 # Milestone 2b, one frame first: reference detectors + my CA-CFAR at 40 m vs IIP labels
    scenes: [S1A_IW_20190429T094108_DHP_RTC10_G_gpuned_671B]   # same-pass IIP labels (5d: 267 compared)
    out_dir: data/benchmark/iw40
    multilook: 4            # 10 m -> 40 m: the paper's windows (9 / 13 px) fit the library's 41 px stencil
    multilook_min_valid: 1.0
    enl_box_m: 2000
    enl_box: auto
    enl_combine: min
    # Total PFA, every 2 decades (the paper's 21 levels halved). Curves are compared at matched
    # detection counts, so sparser points only cost interpolation.
    pfas: [1.0e-21, 1.0e-19, 1.0e-17, 1.0e-15, 1.0e-13, 1.0e-11, 1.0e-9, 1.0e-7, 1.0e-5, 1.0e-3, 1.0e-1]
    # PFAs run in ascending order; a detector stops after the first PFA with more objects than
    # this (~20x the labels; 5d's 10 m CFAR curve ends at 1513). Reference detectors count raw
    # outlier components, the CA-CFAR its final objects.
    max_objects: 5000
    detectors: [gamma, lognorm, k, wishart, nis, idpolrad]
    # My CA-CFAR with and/or without max_structure_m (tags cacfar / cacfar-nolength). Without it
    # is the like-for-like run: the reference detectors have no such rule.
    cacfar_length_rules: [false, true]
    # My CA-CFAR also at native 10 m without the length rule (tag cacfar-nolength-10m), at 5d's
    # PFAs (thor.compare.cfar_pfas) so it pairs with 5d's with-rule curve. [] = skip.
    cacfar_10m_pfas: [1.0e-12, 1.0e-10, 1.0e-8, 1.0e-7, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3]
    # Rows per block at 10 m (detections.block_rows is 1024). A 10 m row is 28,591 px, so 1024-row
    # blocks need a few GB; smaller blocks give the same detections (halo) with less peak RAM.
    cacfar_10m_block_rows: 256
    # Scoring as in 5d (thor.compare): same labels, open-water filter (viewer.near_ice_km), radius
    # validation.max_dist_m. Recall is read off each curve at these detection counts.
    matched_counts: [250, 500, 1000]
    breakdown_count: 500    # size breakdown at each detector's operating point nearest this count
    report: benchmarks/m2b_iw40.md
  faerch2023:               # Stage 2 / Milestone 1: reproduce Færch 2023 on the Sentinel-1 EW scene
    paper_xml: benchmarks/faerch2023/faerch2023.xml
    scenes_csv: benchmarks/faerch2023/scenes.csv
    dir: data/benchmark/faerch2023   # raw/, interim/, labels/, quicklooks/ below this
    # Scene grid: UTM 20N is the five S2 tiles' own CRS, so labels need no reprojection.
    # The paper resampled to a local polar stereographic grid for its C- vs L-band comparison.
    crs: EPSG:32620
    pixel_m: 40
    cdse:                   # Copernicus Data Space; search is public, download needs CDSE_USERNAME / CDSE_PASSWORD in .env
      catalogue_url: https://catalogue.dataspace.copernicus.eu/odata/v1/Products
      token_url: https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token
      download_url: https://download.dataspace.copernicus.eu/odata/v1/Products({id})/$value
    # Sentinel-2: CDSE only has the 2022 reprocessing (N0500); Google's public bucket still has the
    # original 2019 product (N0207), the one the paper could use. Only these files are fetched.
    s2_bucket_url: https://storage.googleapis.com/storage/v1/b/gcp-public-data-sentinel-2/o
    s2_files: [_B02.jp2, _B03.jp2, _B04.jp2, _B08.jp2, _B11.jp2, MTD_MSIL1C.xml, MTD_TL.xml, MSK_CLOUDS_B00.gml]
    footprint_png: data/benchmark/faerch2023/quicklooks/footprints.png
    # Table 1 says EW GRDH, but its ENL (10.7) and 40 m spacing point to GRDM; both are in the
    # scene list. This picks the one the pipeline (labels, detectors) uses; --s1 overrides it.
    s1_format: GRDM         # 2026-10-23: open-water ENL at 40 m is HH 9.5 for GRDM vs 2.45 for GRDH (Table 1: 10.7)
    # The paper's AOI is only drawn in Fig. 1; `bench-fig1` georeferences it from these points.
    fig1_points: benchmarks/faerch2023/fig1_points.csv
    fig1_outlines: benchmarks/faerch2023/fig1_outlines.geojson
    snap:                   # 1b: SNAP GPT preprocessing (graph quotes the paper's processing text)
      gpt: ~/AppData/Local/Programs/esa-snap/bin/gpt.exe   # SNAP 14.0.0, installed 2026-10-22
      graph: benchmarks/faerch2023/s1_ew_preprocess.xml
      cache: 6G             # gpt -c; must stay below -Xmx10G in gpt.vmoptions (16 GB RAM)
      threads: 8
      resampling: NEAREST_NEIGHBOUR   # paper: nearest neighbour, "to avoid averaging pixel intensities"
      # Paper: thermal noise removal on. false = diagnostic variant, files tagged `_noTNR`
      # (`--no-tnr` on bench-preprocess / bench-landmask); the pipeline default stays true.
      remove_thermal_noise: true
    land:
      buffer_m: 500         # paper sec. 3.1
      # Fallback when osmdata.openstreetmap.de is unreachable: land built from the coastline ways
      # of this Geofabrik extract (same OSM data the land polygons are made from).
      osm_pbf: data/land/newfoundland-and-labrador-261020.osm.pbf
    sweep:                  # 1e: every reference detector x 21 PFAs on the 40 m EW stack (`bench-sweep`)
      out_dir: data/benchmark/faerch2023/sweep
      # Paper sec. 3.3: "21 different PFA levels varying from 1e-21 to 1e-1" (one per decade)
      pfa_min_exp: -21
      pfa_max_exp: -1
      detectors: [gamma, lognorm, k, wishart, nis, idpolrad]
      # One ENL for both bands, as the paper (Table 1: 10.7, read from scenes.csv `paper_enl`).
      # Measured on GRDM: HH 9.5 / HV 0.98. `table1` or a number.
      enl: table1
      # PFAs run in ascending order; a detector stops after the first PFA with more objects than
      # this in the whole scene. The AOI is ~1/5 of the scene, so the last PFA scored has >~4000
      # objects in it vs 492 labels (F < 0.2); the paper's optimum has 24-74 false positives.
      max_objects: 20000
    score:                  # 1f: match detections to labels, recall / precision / F per (detector, PFA)
      # Scoring area: S1 valid (swath, no land buffer) x the S2 and ALOS-2 outlines of Fig. 1
      # (`fig1`), or the Path B AOI that also drops clouds and S2 nodata (`reconstructed`).
      aoi: fig1
      aoi_sensitivity: reconstructed   # also scored, reported as one row (FP depend on the area)
      # Detections within this of an "unknown SAR object" (Path A) are ignored: neither TP nor FP
      # (paper: bright objects under clouds, bergs drifting in, one ship were removed).
      unknown_ignore_m: 250
      reference: benchmarks/faerch2023/reference.yaml
      fig6_csv: benchmarks/faerch2023/reference_fig6.csv   # digitized by hand; overlay only if present
      figure: docs/img/faerch2023_f_vs_pfa.png
      report: docs/faerch2023-reproduction.md
      table_csv: data/benchmark/faerch2023/score/scores.csv
    labels_source: faerch   # labels for 1e/1f: faerch (Path A) | reconstructed (Path B); --source overrides
    labels_faerch:          # 1d Path A: the paper's validation set, from Laust Færch (email, 2026-10-24). Private: never commit
      dir: data/benchmark/faerch2023/labels_faerch/data-for-natalia   # unzipped as sent (LZMA zip: Explorer can't open it)
      drift_paths: matching-sentinel2-sentinel1-interpolated.shp   # lines S2 -> S1 position, EPSG:5938
      unknown_objects: sentinel1-unknown-objects.shp               # bright SAR objects without an optical match
      verified_methods: [manual]    # `method` of verified drift paths; "interpolate" = expected drift paths
      s2_pixel_m: 10                # `length` / `width` / `area` are in Sentinel-2 pixels
      radius_verified_m: 250        # paper sec. 3.4
      radius_interpolated_m: 1789
      compare_m: 50                 # report only: rebuilt (Path B) S2 target <-> Færch S2 position
      out_dir: data/benchmark/faerch2023/labels
      report: benchmarks/faerch2023/labels_faerch.md
    labels:                 # 1d Path B: labels rebuilt from Sentinel-2 -> RECONSTRUCTED LABELS
      dir: data/benchmark/faerch2023/labels
      report: benchmarks/faerch2023/labels_rebuilt.md
      bands: [B02, B03, B04, B08]   # paper sec. 3.4: sum of the 10 m bands B2, B3, B4, B8
      n_sigma: 4                    # paper: mean background + 4 standard deviations
      guard_m: 360                  # window not given for S2; the paper's SAR window is reused
      outer_m: 520
      min_ring_fraction: 0.5        # skip pixels whose ring is mostly land / cloud / nodata
      min_area_px: 2                # 1 px (10 m) objects are mostly noise at 4 sigma
      max_area_m2: 300000           # paper: one berg >= 360 m long; larger objects are floes / glitches
      swir_band: B11                # ice is dark in SWIR, clouds are bright
      # The paper removed artifacts by eye. These two rules stand in for that; both were read off a
      # gallery of 4-sigma targets on T20VNL (2026-10-22): 4-sigma alone keeps ~55k objects per tile,
      # almost all wave texture at ~1.3x the water level; bergs have B11 <= 0.026, haze/cloud 0.04-0.09.
      min_contrast: 2.0             # object peak / ring mean (open water ~0.2 summed reflectance)
      max_swir: 0.035               # mean B11 TOA reflectance over the object
      land_buffer_m: 100            # OSM land + 100 m: coastline surf and beaches (the SAR mask is 500 m)
      cloud_min_area_m2: 1000000    # L1C cloud-mask polygons smaller than this are ignored (bergs get flagged)
      cloud_buffer_m: 500
      dedupe_m: 30                  # tiles overlap: one target per object
      aoi_alos2: true               # AOI also inside the ALOS-2 scene (Fig. 1: all bergs are in S1 x S2 x ALOS-2)
      drift:
        incidence_bin_deg: 0.5      # SAR targets: intensity / median at the same incidence angle
        # Global threshold on that ratio, HH AND HV. GRDH needed 12 dB (8 dB: 88k objects of HV
        # speckle); on GRDM (HH ENL 9.5) 8 dB is clean: ~2k objects. Swept 6-10 dB x support
        # 3/4/6 on GRDM (2026-10-23): coherent settings verify 50-60 labels, all slow bergs.
        sar_threshold_db: 8
        max_area_px: 500            # paper's object size limit at 40 m
        search_m: 10000             # max drift per axis; paper mean drift 3953 m
        bin_m: 100                  # displacement histogram
        node_spacing_m: 5000
        neighbourhood_m: 15000      # labels within this of a node share its drift
        min_node_labels: 5
        # Labels that must line up with SAR objects at a node's drift. Swept 3/4/6 x SAR rules
        # (2026-10-22): looser settings "verify" chance alignments (mean drift ~7 km = random in
        # +-10 km); 6 keeps only matches that several bergs agree on.
        min_support: 6
        verify_radius_m: 300        # moved-back label to SAR target, one-to-one
        radius_verified_m: 250      # paper sec. 3.4 search radii, used by the scorer in 1f
        radius_interpolated_m: 1789
        holdout_fraction: 0.1       # paper: interpolation tested on 10 % of the data
    quicklook_max_px: 2400
    # >>> scenes: generated from scenes.csv by `bench-scenes --write-config`
    scenes:
      - {sensor: Sentinel-1, product_id: S1A_EW_GRDH_1SDH_20190704T102730_20190704T102831_027966_032866_DEF7, source: cdse, basis: table1, start: '2019-07-04T10:27:30'}
      - {sensor: Sentinel-1, product_id: S1A_EW_GRDM_1SDH_20190704T102730_20190704T102831_027966_032866_4053, source: cdse, basis: table1_note_format, start: '2019-07-04T10:27:30'}
      - {sensor: Sentinel-2, product_id: S2B_MSIL1C_20190704T153609_N0207_R111_T20VNJ_20190704T190623, source: gcs, basis: table1, start: '2019-07-04T15:36:09'}
      - {sensor: Sentinel-2, product_id: S2B_MSIL1C_20190704T153609_N0207_R111_T20VNL_20190704T190623, source: gcs, basis: table1, start: '2019-07-04T15:36:09'}
      - {sensor: Sentinel-2, product_id: S2B_MSIL1C_20190704T153609_N0207_R111_T20VPJ_20190704T190623, source: gcs, basis: table1, start: '2019-07-04T15:36:09'}
      - {sensor: Sentinel-2, product_id: S2B_MSIL1C_20190704T153609_N0207_R111_T20VPK_20190704T190623, source: gcs, basis: table1, start: '2019-07-04T15:36:09'}
      - {sensor: Sentinel-2, product_id: S2B_MSIL1C_20190704T153609_N0207_R111_T20VPL_20190704T190623, source: gcs, basis: table1, start: '2019-07-04T15:36:09'}
      - {sensor: Sentinel-2, product_id: S2B_MSIL1C_20190704T153609_N0207_R111_T20VNK_20190704T190623, source: gcs, basis: fig1, start: '2019-07-04T15:36:09'}
      - {sensor: Sentinel-2, product_id: S2B_MSIL1C_20190704T153609_N0207_R111_T20VMK_20190704T190623, source: gcs, basis: fig1, start: '2019-07-04T15:36:09'}
      - {sensor: Sentinel-2, product_id: S2B_MSIL1C_20190704T153609_N0207_R111_T20VML_20190704T190623, source: gcs, basis: fig1, start: '2019-07-04T15:36:09'}
